services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_app_universidad
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./App/docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - mysql
    networks:
      - tienda_network

  nginx:
    image: nginx:alpine
    container_name: tienda_nginx_universidad
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tienda_network

  mysql:
    image: mysql:8.4
    container_name: tienda_mysql_universidad
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tienda_ropa
      MYSQL_USER: laravel
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tienda_network

  oracle:
    image: gvenzl/oracle-free:slim
    container_name: tienda_oracle_universidad
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: root        # contraseña de los usuarios administradores (SYS/SYSTEM)
      APP_USER: laravel            # usuario que usará tu app Laravel
      APP_USER_PASSWORD: root      # contraseña de ese usuario
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - tienda_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tienda_phpmyadmin_universidad
    restart: unless-stopped
    ports:
      - "8181:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - tienda_network

  mailpit:
    image: axllent/mailpit
    container_name: tienda_mailpit_universidad
    restart: unless-stopped
    ports:
      - "8125:8025"
      - "1125:1025"
    networks:
      - tienda_network

networks:
  tienda_network:
    driver: bridge

volumes:
  mysql_data:
  oracle_data: